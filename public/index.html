<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Streamer</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #23232f;
      --border: #2e2e3e;
      --accent: #7c6af5;
      --accent-hover: #9485ff;
      --text: #e8e8f0;
      --text-muted: #888899;
      --danger: #e05555;
      --radius: 10px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
    }

    /* ── Layout ── */
    #app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }

    #breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      overflow: hidden;
      font-size: 0.85rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    #breadcrumb span { cursor: pointer; }
    #breadcrumb span:hover { color: var(--accent); }
    #breadcrumb .sep { opacity: 0.4; }
    #breadcrumb .current { color: var(--text); cursor: default; }

    main {
      flex: 1;
      padding: 24px;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Count bar ── */
    #count-bar {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      min-height: 1.2em;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
      overflow: hidden;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(124, 106, 245, 0.18);
    }

    .card-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface2);
      font-size: 3rem;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-info {
      padding: 10px 12px;
    }

    .card-name {
      font-size: 0.85rem;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* ── Player overlay ── */
    #player-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 200;
    }

    #player-overlay.active {
      display: block;
    }

    /* ── YouTube-style container ── */
    #yt-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #video-player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      outline: none;
    }

    #yt-controls {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    #yt-controls.yt-hidden {
      opacity: 0;
    }

    #yt-controls > * {
      pointer-events: auto;
    }

    /* Top bar */
    #yt-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      padding: 16px 20px 48px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, transparent 100%);
    }

    #yt-title-text {
      flex: 1;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Center controls */
    #yt-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Bottom bar */
    #yt-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 48px 16px 12px;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
    }

    /* Progress bar */
    #yt-progress-wrap {
      position: relative;
      height: 4px;
      cursor: pointer;
      margin-bottom: 10px;
      border-radius: 2px;
      background: rgba(255,255,255,0.2);
    }

    #yt-progress-wrap:hover {
      height: 6px;
    }

    #yt-buffered {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: rgba(255,255,255,0.4);
      border-radius: 2px;
      pointer-events: none;
    }

    #yt-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: #ff0000;
      border-radius: 2px;
      pointer-events: none;
    }

    #yt-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 14px;
      height: 14px;
      background: #ff0000;
      border-radius: 50%;
      pointer-events: none;
      transition: transform 0.1s;
    }

    #yt-progress-wrap:hover #yt-thumb {
      transform: translate(-50%, -50%) scale(1);
    }

    /* Bar row */
    #yt-bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #yt-time {
      font-size: 0.85rem;
      color: #fff;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* Buttons */
    .yt-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 1.4rem;
      padding: 6px 10px;
      border-radius: 4px;
      line-height: 1;
      opacity: 0.9;
      transition: opacity 0.15s, background 0.15s;
    }

    .yt-btn:hover {
      opacity: 1;
      background: rgba(255,255,255,0.15);
    }

    .yt-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .yt-btn:disabled:hover {
      background: none;
    }

    #yt-center .yt-btn {
      font-size: 1.6rem;
      padding: 10px 14px;
    }

    #yt-play-center {
      font-size: 2.2rem;
      padding: 12px 18px;
    }

    /* ── Empty / error states ── */
    .empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }

    .empty .icon { font-size: 4rem; margin-bottom: 16px; }
    .empty h2 { font-size: 1.2rem; margin-bottom: 8px; color: var(--text); }
    .empty p { font-size: 0.9rem; line-height: 1.5; }
    .empty code {
      background: var(--surface2);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }

    /* ── Loading ── */
    #loading {
      display: none;
      text-align: center;
      padding: 60px;
      color: var(--text-muted);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      header { padding: 0 14px; }
      main { padding: 14px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    }

    @media (min-width: 1200px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">&#9654; My Streamer</div>
    <nav id="breadcrumb"></nav>
  </header>

  <main>
    <div id="loading">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>
    <div id="count-bar"></div>
    <div id="grid-container" class="grid"></div>
  </main>
</div>

<div id="player-overlay">
  <div id="yt-container">
    <video id="video-player" autoplay playsinline></video>

    <div id="yt-controls">
      <!-- Top bar: title + close -->
      <div id="yt-top">
        <div id="yt-title-text"></div>
        <div style="flex:1"></div>
        <button class="yt-btn" id="yt-close" title="Close (Esc)">&#x2715;</button>
      </div>

      <!-- Center: prev / -10 / play / +10 / next -->
      <div id="yt-center">
        <button class="yt-btn" id="yt-prev" title="Previous">&#9198;</button>
        <button class="yt-btn" id="yt-rewind" title="-10s">&#8635; 10</button>
        <button class="yt-btn" id="yt-play-center" title="Play/Pause">&#9654;</button>
        <button class="yt-btn" id="yt-forward" title="+10s">10 &#8634;</button>
        <button class="yt-btn" id="yt-next" title="Next">&#9197;</button>
      </div>

      <!-- Bottom: progress + bar row -->
      <div id="yt-bottom">
        <div id="yt-progress-wrap">
          <div id="yt-buffered"></div>
          <div id="yt-fill"></div>
          <div id="yt-thumb"></div>
        </div>
        <div id="yt-bar-row">
          <button class="yt-btn" id="yt-play2" title="Play/Pause">&#9654;</button>
          <span id="yt-time">0:00 / 0:00</span>
          <div style="flex:1"></div>
          <button class="yt-btn" id="yt-mute" title="Mute">&#128266;</button>
          <button class="yt-btn" id="yt-fs" title="Fullscreen">&#x26F6;</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const SERVER = 'http://192.168.100.13:3001';

  const grid = document.getElementById('grid-container');
  const loading = document.getElementById('loading');
  const breadcrumb = document.getElementById('breadcrumb');
  const countBar = document.getElementById('count-bar');
  const playerOverlay = document.getElementById('player-overlay');
  const videoPlayer = document.getElementById('video-player');
  const ytContainer = document.getElementById('yt-container');
  const ytControls = document.getElementById('yt-controls');

  const ytTitleText = document.getElementById('yt-title-text');
  const ytClose = document.getElementById('yt-close');
  const ytPrev = document.getElementById('yt-prev');
  const ytNext = document.getElementById('yt-next');
  const ytRewind = document.getElementById('yt-rewind');
  const ytForward = document.getElementById('yt-forward');
  const ytPlayCenter = document.getElementById('yt-play-center');
  const ytPlay2 = document.getElementById('yt-play2');
  const ytTime = document.getElementById('yt-time');
  const ytFill = document.getElementById('yt-fill');
  const ytBuffered = document.getElementById('yt-buffered');
  const ytThumb = document.getElementById('yt-thumb');
  const ytProgressWrap = document.getElementById('yt-progress-wrap');
  const ytMute = document.getElementById('yt-mute');
  const ytFs = document.getElementById('yt-fs');

  let currentPath = '';
  let currentItem = null;
  let currentItems = [];
  let currentIndex = -1;
  let hlsInstance = null;
  let hideTimer = null;

  // ── HLS player ──────────────────────────────────────────────────────────────

  function loadHls(item) {
    if (hlsInstance) {
      hlsInstance.destroy();
      hlsInstance = null;
    }

    videoPlayer.querySelectorAll('track').forEach(t => t.remove());

    const playlistUrl = `${SERVER}/hls/playlist?path=${encodeURIComponent(item.relativePath)}`;
    const subtitleUrl = `${SERVER}/subtitle?path=${encodeURIComponent(item.relativePath)}`;

    if (Hls.isSupported()) {
      hlsInstance = new Hls();
      hlsInstance.loadSource(playlistUrl);
      hlsInstance.attachMedia(videoPlayer);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
        videoPlayer.play().catch(() => {});
      });
    } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
      // Safari native HLS
      videoPlayer.src = playlistUrl;
      videoPlayer.play().catch(() => {});
    }

    const track = document.createElement('track');
    track.kind = 'subtitles';
    track.src = subtitleUrl;
    track.default = true;
    videoPlayer.appendChild(track);
  }

  // ── Controls UI ─────────────────────────────────────────────────────────────

  function formatDuration(ms) {
    if (!ms && ms !== 0) return '';
    const totalSec = Math.round(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    if (h > 0) {
      return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function formatSec(sec) {
    return formatDuration(sec * 1000);
  }

  function updatePlayButtons() {
    const icon = videoPlayer.paused ? '&#9654;' : '&#9646;&#9646;';
    ytPlayCenter.innerHTML = icon;
    ytPlay2.innerHTML = icon;
  }

  function updateMuteButton() {
    ytMute.innerHTML = videoPlayer.muted ? '&#128263;' : '&#128266;';
  }

  function updateNavButtons() {
    ytPrev.disabled = currentIndex <= 0;
    ytNext.disabled = currentIndex >= currentItems.length - 1;
  }

  // RAF loop: update progress fill, time, buffered
  function rafLoop() {
    if (!playerOverlay.classList.contains('active')) return;
    requestAnimationFrame(rafLoop);

    const dur = videoPlayer.duration;
    const cur = videoPlayer.currentTime;

    if (dur && isFinite(dur) && dur > 0) {
      const pct = cur / dur;
      ytFill.style.width = (pct * 100) + '%';
      ytThumb.style.left = (pct * 100) + '%';

      // Buffered
      let buffEnd = 0;
      for (let i = 0; i < videoPlayer.buffered.length; i++) {
        if (videoPlayer.buffered.start(i) <= cur) {
          buffEnd = Math.max(buffEnd, videoPlayer.buffered.end(i));
        }
      }
      ytBuffered.style.width = (buffEnd / dur * 100) + '%';

      ytTime.textContent = `${formatSec(cur)} / ${formatSec(dur)}`;
    } else {
      ytFill.style.width = '0%';
      ytThumb.style.left = '0%';
      ytTime.textContent = formatSec(cur) + ' / --:--';
    }
  }

  // Auto-hide controls
  function showControls() {
    ytControls.classList.remove('yt-hidden');
    clearTimeout(hideTimer);
    if (!videoPlayer.paused) {
      hideTimer = setTimeout(() => {
        ytControls.classList.add('yt-hidden');
      }, 3000);
    }
  }

  ytContainer.addEventListener('mousemove', showControls);
  ytContainer.addEventListener('click', showControls);

  videoPlayer.addEventListener('pause', () => {
    clearTimeout(hideTimer);
    ytControls.classList.remove('yt-hidden');
    updatePlayButtons();
  });

  videoPlayer.addEventListener('play', () => {
    updatePlayButtons();
    showControls();
  });

  // Progress bar seek
  function seekFromEvent(e) {
    const rect = ytProgressWrap.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    const dur = videoPlayer.duration;
    if (dur && isFinite(dur)) {
      videoPlayer.currentTime = pct * dur;
    }
  }

  let isDragging = false;
  ytProgressWrap.addEventListener('mousedown', e => {
    isDragging = true;
    seekFromEvent(e);
  });
  document.addEventListener('mousemove', e => { if (isDragging) seekFromEvent(e); });
  document.addEventListener('mouseup', () => { isDragging = false; });

  // Buttons
  function togglePlay() {
    if (videoPlayer.paused) videoPlayer.play().catch(() => {});
    else videoPlayer.pause();
  }

  ytPlayCenter.addEventListener('click', togglePlay);
  ytPlay2.addEventListener('click', togglePlay);

  ytRewind.addEventListener('click', () => { videoPlayer.currentTime = Math.max(0, videoPlayer.currentTime - 10); });
  ytForward.addEventListener('click', () => { videoPlayer.currentTime = Math.min(videoPlayer.duration || Infinity, videoPlayer.currentTime + 10); });

  ytMute.addEventListener('click', () => {
    videoPlayer.muted = !videoPlayer.muted;
    updateMuteButton();
  });

  ytFs.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      ytContainer.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  });

  ytClose.addEventListener('click', closePlayer);

  ytPrev.addEventListener('click', () => {
    if (currentIndex > 0) playVideo(currentItems[currentIndex - 1]);
  });

  ytNext.addEventListener('click', () => {
    if (currentIndex < currentItems.length - 1) playVideo(currentItems[currentIndex + 1]);
  });

  // Keyboard
  document.addEventListener('keydown', e => {
    if (!playerOverlay.classList.contains('active')) return;
    switch (e.key) {
      case 'Escape': closePlayer(); break;
      case ' ': e.preventDefault(); togglePlay(); break;
      case 'ArrowLeft': videoPlayer.currentTime = Math.max(0, videoPlayer.currentTime - 10); showControls(); break;
      case 'ArrowRight': videoPlayer.currentTime = Math.min(videoPlayer.duration || Infinity, videoPlayer.currentTime + 10); showControls(); break;
      case 'f': case 'F':
        if (!document.fullscreenElement) ytContainer.requestFullscreen().catch(() => {});
        else document.exitFullscreen();
        break;
      case 'm': case 'M':
        videoPlayer.muted = !videoPlayer.muted;
        updateMuteButton();
        break;
    }
  });

  // ── Video playback ───────────────────────────────────────────────────────────

  function playVideo(item) {
    currentItem = item;
    currentIndex = currentItems.indexOf(item);
    updateNavButtons();

    ytTitleText.textContent = item.name;
    playerOverlay.classList.add('active');

    loadHls(item);
    updatePlayButtons();
    updateMuteButton();
    showControls();
    requestAnimationFrame(rafLoop);
  }

  function closePlayer() {
    videoPlayer.pause();
    if (hlsInstance) {
      hlsInstance.destroy();
      hlsInstance = null;
    }
    videoPlayer.src = '';
    playerOverlay.classList.remove('active');
    currentItem = null;
    clearTimeout(hideTimer);
    if (document.fullscreenElement) document.exitFullscreen();
  }

  // ── Browse ───────────────────────────────────────────────────────────────────

  function formatSize(bytes) {
    if (!bytes) return '';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
  }

  function fileIcon(ext) {
    const map = {
      '.mp4': '🎬', '.mkv': '🎬', '.avi': '🎬', '.mov': '🎬',
      '.wmv': '🎬', '.flv': '🎬', '.webm': '🎬', '.m4v': '🎬',
      '.ts': '🎬', '.m2ts': '🎬',
    };
    return map[ext] || '🎞️';
  }

  function buildBreadcrumb(currentPath) {
    breadcrumb.innerHTML = '';

    const root = document.createElement('span');
    root.textContent = 'Home';
    root.addEventListener('click', () => browse(''));
    breadcrumb.appendChild(root);

    if (!currentPath) return;

    const parts = currentPath.split('/').filter(Boolean);
    parts.forEach((part, i) => {
      const sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = '/';
      breadcrumb.appendChild(sep);

      const seg = document.createElement('span');
      seg.textContent = part;

      if (i === parts.length - 1) {
        seg.className = 'current';
      } else {
        const segPath = parts.slice(0, i + 1).join('/');
        seg.addEventListener('click', () => browse(segPath));
      }
      breadcrumb.appendChild(seg);
    });
  }

  async function browse(subPath) {
    currentPath = subPath || '';
    grid.innerHTML = '';
    countBar.textContent = '';
    loading.style.display = 'block';

    buildBreadcrumb(currentPath);

    try {
      const res = await fetch(`${SERVER}/api/browse?path=${encodeURIComponent(currentPath)}`);
      const data = await res.json();
      loading.style.display = 'none';

      if (data.error) {
        grid.innerHTML = `<div class="empty"><div class="icon">⚠️</div><h2>Error</h2><p>${data.error}</p></div>`;
        return;
      }

      if (data.items.length === 0) {
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="icon">📂</div><h2>No videos found</h2><p>This folder is empty or has no supported video files.</p></div>`;
        return;
      }

      const folders = data.items.filter(i => i.type === 'directory');
      const files = data.items.filter(i => i.type === 'file');
      currentItems = files;

      const parts = [];
      if (folders.length > 0) parts.push(`${folders.length} folder${folders.length !== 1 ? 's' : ''}`);
      if (files.length > 0) parts.push(`${files.length} video${files.length !== 1 ? 's' : ''}`);
      countBar.textContent = parts.join(' · ');

      data.items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        const thumb = document.createElement('div');
        thumb.className = 'card-thumb';
        thumb.textContent = item.type === 'directory' ? '📁' : fileIcon(item.ext);

        const info = document.createElement('div');
        info.className = 'card-info';

        const name = document.createElement('div');
        name.className = 'card-name';
        name.title = item.name;
        name.textContent = item.name;

        const meta = document.createElement('div');
        meta.className = 'card-meta';
        meta.textContent = item.type === 'directory' ? 'Folder' : (item.ext.replace('.', '').toUpperCase() + (item.size ? '  ·  ' + formatSize(item.size) : ''));

        info.appendChild(name);
        info.appendChild(meta);
        card.appendChild(thumb);
        card.appendChild(info);

        card.addEventListener('click', () => {
          if (item.type === 'directory') {
            browse(item.relativePath);
          } else {
            playVideo(item);
          }
        });

        grid.appendChild(card);
      });

    } catch (err) {
      loading.style.display = 'none';
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="icon">⚠️</div><h2>Could not load</h2><p>${err.message}</p></div>`;
    }
  }

  // Start at root
  browse('');
</script>
</body>
</html>
